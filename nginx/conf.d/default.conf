# إعدادات المنفذ 80 — إعادة التوجيه لـ HTTPS
server {
    listen 80;
    server_name _;

    # تحدي ACME لشهادات Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# إعدادات HTTPS — الواجهة والخادم
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # الشهادات (تُملأ عند الإنتاج)
    ssl_certificate /etc/letsencrypt/live/accounting/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounting/privkey.pem;

    # إعدادات TLS الحديثة
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ترويسات الأمان
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # الواجهة الأمامية
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # واجهة برمجية للخادم
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # حد المعدل الأساسي
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 60s;
    }

    # الفحص الصحي
    location /health {
        proxy_pass http://backend:8010/health;
        access_log off;
    }
}
