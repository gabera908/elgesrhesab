# إعدادات الإنتاج — بورتات مخصصة 8096/8444 حتى لا تتعارض مع default.conf
# يستبدل المتغيرات تلقائياً عبر envsubst عند النشر
# المتغيرات: ${HOST_DOMAIN}

# إعادة التوجيه HTTP -> HTTPS
server {
    listen 8096;
    server_name ${HOST_DOMAIN};

    # تحدي ACME لـ Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;
    }

    location / {
        return 301 https://$host:8444$request_uri;
    }
}

# HTTPS — الواجهة والخادم
server {
    listen 8444 ssl http2;
    server_name ${HOST_DOMAIN};

    # الشهادات (تُدار عبر certbot)
    ssl_certificate /etc/letsencrypt/live/${HOST_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HOST_DOMAIN}/privkey.pem;

    # إعدادات TLS الحديثة (Mozilla Intermediate 2024)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ترويسات الأمان
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # حد حجم الرفع
    client_max_body_size 20m;

    # ضغط
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # الواجهة الأمامية
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # واجهة برمجية للخادم
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # حدود المعدل
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # الفحص الصحي
    location /health {
        proxy_pass http://backend:8010/health;
        access_log off;
    }
}

# حدود المعدل (يجب أن تكون في مستوى http في nginx.conf)
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
