# إعدادات الشبكة المحلية (LAN) — HTTP فقط على البورت 8095 بدون SSL
# مخصص للوصول عبر IP داخل الشبكة (مثل Tailscale) حيث لا يمكن إصدار شهادات عامة.
# عند توفر دومين عام، استخدم prod.conf (8096/8444) مع Let's Encrypt بدلاً من هذا الملف.
server {
    listen 8095;
    server_name _;

    # ترويسات الأمان (بدون HSTS لأن الاتصال غير مشفر على مستوى HTTP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # الواجهة الأمامية
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # واجهة برمجية للخادم
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # حد المعدل الأساسي
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 60s;
    }

    # الفحص الصحي
    location /health {
        proxy_pass http://backend:8010/health;
        access_log off;
    }
}
